<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="100%" height="auto" class="westeros-interactive-svg">
  <defs>
    <radialGradient id="oceanBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#05080e"/>
    </radialGradient>
    <filter id="regionGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#d4af37" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- Shivering Ocean Background -->
  <rect x="0" y="0" width="360" height="520" fill="url(#oceanBg)"/>

  <!-- Compass Rose -->
  <g transform="translate(40, 50)" opacity="0.6">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#d4af37" stroke-width="0.8" stroke-dasharray="2 2"/>
    <polygon points="0,-22 4,-6 0,0 -4,-6" fill="#d4af37"/>
    <polygon points="0,22 4,6 0,0 -4,6" fill="#78909c"/>
    <polygon points="22,0 6,4 0,0 6,-4" fill="#78909c"/>
    <polygon points="-22,0 -6,4 0,0 -6,-4" fill="#78909c"/>
    <text x="-4" y="-25" fill="#d4af37" font-size="9" font-family="'Cinzel', serif">N</text>
  </g>

  <!-- 1. BEYOND THE WALL -->
  <path id="svg-reg-wall" class="map-svg-region" data-region="Beyond the Wall"
        d="M 120 10 Q 180 5 240 15 Q 260 40 230 65 L 130 65 Q 100 35 120 10 Z"
        fill="#e0f7fa" stroke="#4dd0e1" stroke-width="1.2" opacity="0.85"/>
  <line x1="125" y1="65" x2="235" y2="65" stroke="#ffffff" stroke-width="3" stroke-dasharray="4 2"/>
  <text x="145" y="42" fill="#006064" font-size="8" font-family="'Cinzel', serif" font-weight="bold">THE WALL ❄️</text>

  <!-- 2. THE NORTH -->
  <path id="svg-reg-north" class="map-svg-region" data-region="The North"
        d="M 130 65 L 230 65 Q 260 110 240 180 Q 210 210 185 210 Q 150 200 135 190 Q 110 140 130 65 Z"
        fill="#263238" stroke="#78909c" stroke-width="1.2"/>
  <circle cx="180" cy="120" r="4" fill="#d4af37" class="castle-node" data-castle="Winterfell"/>
  <text x="150" y="140" fill="#cfd8dc" font-size="9" font-family="'Cinzel', serif" font-weight="bold">THE NORTH 🐺</text>

  <!-- 3. THE VALE -->
  <path id="svg-reg-vale" class="map-svg-region" data-region="The Vale"
        d="M 210 210 Q 270 215 280 260 Q 240 285 210 270 Q 200 235 210 210 Z"
        fill="#37474f" stroke="#90a4ae" stroke-width="1.2"/>
  <circle cx="245" cy="245" r="4" fill="#d4af37" class="castle-node" data-castle="The Eyrie"/>
  <text x="225" y="260" fill="#b0bec5" font-size="8" font-family="'Cinzel', serif">VALE 🦅</text>

  <!-- 4. RIVERLANDS -->
  <path id="svg-reg-riverlands" class="map-svg-region" data-region="Riverlands"
        d="M 140 205 Q 185 210 210 235 L 200 285 Q 160 295 135 270 Q 130 230 140 205 Z"
        fill="#1e3d3b" stroke="#26a69a" stroke-width="1.2"/>
  <!-- Trident Rivers -->
  <path d="M 150 220 Q 170 245 190 260 M 170 245 Q 160 270 150 280" stroke="#4dd0e1" stroke-width="1.5" fill="none"/>
  <circle cx="165" cy="255" r="4" fill="#d4af37" class="castle-node" data-castle="Riverrun"/>
  <text x="145" y="240" fill="#80cbc4" font-size="8" font-family="'Cinzel', serif">RIVERLANDS 🐟</text>

  <!-- 5. IRON ISLANDS -->
  <g id="svg-reg-islands" class="map-svg-region" data-region="Iron Islands">
    <ellipse cx="105" cy="235" rx="8" ry="12" fill="#263238" stroke="#78909c"/>
    <ellipse cx="95" cy="255" rx="6" ry="8" fill="#263238" stroke="#78909c"/>
    <circle cx="105" cy="235" r="3" fill="#d4af37" class="castle-node" data-castle="Pyke"/>
    <text x="65" y="245" fill="#90a4ae" font-size="7" font-family="'Cinzel', serif">PYKE 🐙</text>
  </g>

  <!-- 6. WESTERLANDS -->
  <path id="svg-reg-westerlands" class="map-svg-region" data-region="Westerlands"
        d="M 105 270 Q 135 270 145 295 L 140 345 Q 95 340 100 295 Z"
        fill="#4a3b1a" stroke="#d4af37" stroke-width="1.2"/>
  <circle cx="115" cy="315" r="4.5" fill="#ffd700" class="castle-node" data-castle="Casterly Rock"/>
  <text x="92" y="310" fill="#ffd54f" font-size="8" font-family="'Cinzel', serif" font-weight="bold">WESTERLANDS 🦁</text>

  <!-- 7. CROWNLANDS (KING'S LANDING) -->
  <path id="svg-reg-crownlands" class="map-svg-region" data-region="Crownlands"
        d="M 195 280 Q 240 280 250 315 Q 220 345 190 335 L 185 295 Z"
        fill="#5c1d24" stroke="#e53935" stroke-width="1.2"/>
  <circle cx="215" cy="315" r="5" fill="#ffd700" stroke="#d50000" stroke-width="1.5" class="castle-node" data-castle="King's Landing"/>
  <text x="180" y="328" fill="#ffcdd2" font-size="8" font-family="'Cinzel', serif" font-weight="bold">KING'S LANDING 👑</text>

  <!-- 8. THE REACH -->
  <path id="svg-reg-reach" class="map-svg-region" data-region="The Reach"
        d="M 100 345 Q 165 335 185 365 L 180 430 Q 110 440 90 395 Z"
        fill="#1b3a24" stroke="#4caf50" stroke-width="1.2"/>
  <circle cx="140" cy="385" r="4" fill="#d4af37" class="castle-node" data-castle="Highgarden"/>
  <text x="115" y="375" fill="#a5d6a7" font-size="9" font-family="'Cinzel', serif">THE REACH 🌹</text>

  <!-- 9. STORMLANDS -->
  <path id="svg-reg-stormlands" class="map-svg-region" data-region="Stormlands"
        d="M 185 345 Q 240 335 250 375 Q 230 420 185 415 Z"
        fill="#262a36" stroke="#5c6bc0" stroke-width="1.2"/>
  <circle cx="220" cy="375" r="4" fill="#d4af37" class="castle-node" data-castle="Storm's End"/>
  <text x="190" y="395" fill="#c5cae9" font-size="8" font-family="'Cinzel', serif">STORMLANDS 🦌</text>

  <!-- 10. DORNE -->
  <path id="svg-reg-dorne" class="map-svg-region" data-region="Dorne"
        d="M 100 440 Q 180 425 240 430 Q 260 480 200 500 Q 120 495 100 440 Z"
        fill="#5d2800" stroke="#ff9800" stroke-width="1.2"/>
  <circle cx="210" cy="465" r="4" fill="#d4af37" class="castle-node" data-castle="Sunspear"/>
  <text x="150" y="475" fill="#ffe0b2" font-size="9" font-family="'Cinzel', serif" font-weight="bold">DORNE ☀️</text>
</svg>