<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="robeGray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78909c"/>
      <stop offset="50%" stop-color="#455a64"/>
      <stop offset="100%" stop-color="#263238"/>
    </linearGradient>
    <linearGradient id="chainMetal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="25%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#b0bec5"/>
      <stop offset="75%" stop-color="#b08d57"/>
      <stop offset="100%" stop-color="#90a4ae"/>
    </linearGradient>
  </defs>
  <!-- Maester Grey Robes -->
  <polygon points="18,74 62,74 54,34 26,34" fill="url(#robeGray)" stroke="#1c2529" stroke-width="1.2"/>
  <!-- Citadel Maester Collar Chain Links -->
  <ellipse cx="40" cy="40" rx="16" ry="6" fill="none" stroke="url(#chainMetal)" stroke-width="3" stroke-dasharray="4 2"/>
  <ellipse cx="40" cy="46" rx="14" ry="5" fill="none" stroke="url(#chainMetal)" stroke-width="2.5" stroke-dasharray="3 2"/>
  <!-- Wise Face & Bald Head -->
  <circle cx="40" cy="22" r="10" fill="#cfd8dc"/>
  <path d="M30 20 Q40 14 50 20" stroke="#b0bec5" stroke-width="1.5" fill="none"/>
  <!-- Ancient Parchment Scroll -->
  <rect x="30" y="54" width="20" height="14" rx="2" fill="#fff8e1" stroke="#8d6e63" stroke-width="1"/>
  <line x1="34" y1="58" x2="46" y2="58" stroke="#5d4037" stroke-width="1"/>
  <line x1="34" y1="62" x2="44" y2="62" stroke="#5d4037" stroke-width="1"/>
</svg>