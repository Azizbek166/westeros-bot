<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="shieldBronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="50%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#8d6e63"/>
    </linearGradient>
  </defs>
  <!-- Long Spear pointing diagonally up -->
  <line x1="16" y1="72" x2="68" y2="10" stroke="#5d4037" stroke-width="2.5"/>
  <polygon points="65,14 74,6 68,18" fill="#cfd8dc" stroke="#455a64" stroke-width="1"/>
  <circle cx="67" cy="15" r="1.5" fill="#d4af37"/>
  <!-- Spearman Silhouette behind shield -->
  <circle cx="36" cy="24" r="7" fill="#546e7a"/>
  <polygon points="34,18 38,12 42,18" fill="#263238"/>
  <!-- Heavy Bronze Phalanx Shield -->
  <circle cx="38" cy="46" r="18" fill="url(#shieldBronze)" stroke="#4e342e" stroke-width="2"/>
  <circle cx="38" cy="46" r="14" fill="none" stroke="#6d4c41" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- Shield Boss Spike -->
  <circle cx="38" cy="46" r="4" fill="#3e2723"/>
  <circle cx="38" cy="46" r="2" fill="#fff59d"/>
</svg>