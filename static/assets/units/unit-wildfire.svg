<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <radialGradient id="greenFlame" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b9f6ca"/>
      <stop offset="40%" stop-color="#00e676"/>
      <stop offset="75%" stop-color="#00c853"/>
      <stop offset="100%" stop-color="#004d40"/>
    </radialGradient>
    <filter id="alchemyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00e676" flood-opacity="0.85"/>
    </filter>
  </defs>
  <!-- Clay Flask Body -->
  <path d="M30 68 L50 68 C58 68 62 60 62 50 C62 42 54 36 46 34 L46 24 L34 24 L34 34 C26 36 18 42 18 50 C18 60 22 68 30 68 Z" fill="#3e2723" stroke="#263238" stroke-width="1.5"/>
  <!-- Flask Neck & Cork -->
  <rect x="34" y="18" width="12" height="7" rx="1" fill="#8d6e63" stroke="#3e2723" stroke-width="1"/>
  <!-- Glowing Pyromancer Rune on Flask -->
  <circle cx="40" cy="50" r="10" fill="url(#greenFlame)" filter="url(#alchemyGlow)"/>
  <!-- Wildfire Flame Erupting -->
  <path d="M40 18 Q35 8 40 2 Q46 8 40 18 Z" fill="#69f0ae" filter="url(#alchemyGlow)"/>
  <circle cx="40" cy="8" r="2" fill="#ffffff"/>
  <!-- Spilled Drop of Wildfire -->
  <circle cx="56" cy="62" r="2.5" fill="#00e676" filter="url(#alchemyGlow)"/>
</svg>