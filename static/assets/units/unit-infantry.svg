<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="ironHelm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfd8dc"/>
      <stop offset="50%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
    <linearGradient id="steelBlade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#b0bec5"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </linearGradient>
  </defs>
  <!-- Shield on left -->
  <path d="M14 26 L34 26 L34 46 C34 58 24 68 24 68 C24 68 14 58 14 46 Z" fill="#b71c1c" stroke="#d4af37" stroke-width="1.5"/>
  <circle cx="24" cy="42" r="3" fill="#d4af37"/>
  <!-- Armored Body -->
  <rect x="30" y="32" width="22" height="28" rx="4" fill="url(#ironHelm)" stroke="#263238" stroke-width="1.2"/>
  <rect x="33" y="36" width="16" height="4" fill="#263238"/>
  <!-- Helmet (Kettle / Sallet) -->
  <path d="M34 24 Q41 12 48 24 Z" fill="url(#ironHelm)" stroke="#263238" stroke-width="1.2"/>
  <rect x="32" y="24" width="18" height="5" rx="1" fill="#37474f"/>
  <line x1="36" y1="26" x2="46" y2="26" stroke="#111" stroke-width="1.5"/>
  <!-- Sword in right hand -->
  <path d="M52 38 L68 10 L71 11 L55 40 Z" fill="url(#steelBlade)"/>
  <rect x="50" y="38" width="8" height="2" transform="rotate(-30 54 39)" fill="#d4af37"/>
  <circle cx="49" cy="42" r="2" fill="#d4af37"/>
</svg>