<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="leatherCoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="50%" stop-color="#5d4037"/>
      <stop offset="100%" stop-color="#3e2723"/>
    </linearGradient>
    <linearGradient id="bowWood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a1887f"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
  </defs>
  <!-- Quiver on back -->
  <polygon points="22,25 30,22 26,55 18,52" fill="#3e2723"/>
  <line x1="24" y1="22" x2="21" y2="12" stroke="#cfd8dc" stroke-width="1.5"/>
  <line x1="28" y1="20" x2="26" y2="10" stroke="#cfd8dc" stroke-width="1.5"/>
  <!-- Archer Body -->
  <ellipse cx="40" cy="42" rx="12" ry="16" fill="url(#leatherCoat)"/>
  <!-- Hood / Cowl -->
  <circle cx="40" cy="22" r="9" fill="#4e342e"/>
  <path d="M33 22 Q40 12 47 22 Q40 18 33 22 Z" fill="#2d1c18"/>
  <!-- Face shadow -->
  <circle cx="40" cy="23" r="6" fill="#1b110e"/>
  <!-- Powerful Recurve Bow -->
  <path d="M52 10 Q68 38 52 66" stroke="url(#bowWood)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Bowstring -->
  <line x1="52" y1="10" x2="42" y2="38" stroke="#eceff1" stroke-width="1"/>
  <line x1="42" y1="38" x2="52" y2="66" stroke="#eceff1" stroke-width="1"/>
  <!-- Drawn Arrow -->
  <line x1="38" y1="38" x2="72" y2="38" stroke="#cfd8dc" stroke-width="1.8"/>
  <polygon points="72,35 78,38 72,41" fill="#78909c"/>
</svg>