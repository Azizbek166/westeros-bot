<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="crimsonAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.38"/>
      <stop offset="65%" stop-color="#880e4f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crimsonScaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d50000"/>
      <stop offset="35%" stop-color="#8e0000"/>
      <stop offset="70%" stop-color="#400000"/>
      <stop offset="100%" stop-color="#1a0000"/>
    </linearGradient>
    <linearGradient id="crimsonHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="45%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#560000"/>
    </linearGradient>
    <linearGradient id="crimsonHorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3e2723"/>
      <stop offset="50%" stop-color="#210c0c"/>
      <stop offset="100%" stop-color="#0a0505"/>
    </linearGradient>
    <radialGradient id="crimsonMembrane" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="40%" stop-color="#5f0909"/>
      <stop offset="100%" stop-color="#150202"/>
    </radialGradient>
    <linearGradient id="crimsonFire" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ff8a80"/>
      <stop offset="45%" stop-color="#ff1744"/>
      <stop offset="75%" stop-color="#d50000"/>
      <stop offset="100%" stop-color="#880e4f" stop-opacity="0"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aura -->
  <circle cx="120" cy="120" r="110" fill="url(#crimsonAura)"/>

  <!-- Left Distant Wing -->
  <g opacity="0.85">
    <path d="M72 110 L15 32 Q45 28 85 45 Q115 65 110 95 Z" fill="url(#crimsonMembrane)"/>
    <path d="M72 110 L15 32 Q28 62 48 95" stroke="#ff5252" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>
    <path d="M72 110 Q50 65 15 32 Q14 28 18 30 Q58 60 76 106 Z" fill="url(#crimsonScaleGrad)"/>
    <path d="M15 32 L11 25 L16 28 Z" fill="#ffcdd2"/>
  </g>

  <!-- Neck -->
  <path d="M92 195 Q105 145 125 105 Q145 75 168 68 Q155 120 135 185 Q118 215 92 195 Z" fill="url(#crimsonScaleGrad)"/>
  <!-- Underbelly Scales -->
  <path d="M128 178 Q140 140 155 102 Q158 96 162 104 Q146 142 134 182 Z" fill="#ff5252" opacity="0.8"/>

  <!-- Foreground Wing -->
  <g>
    <path d="M95 145 Q125 40 185 15 C175 42 192 68 180 102 C162 106 138 128 112 148 Z" fill="url(#crimsonMembrane)"/>
    <path d="M95 145 Q135 78 185 15" stroke="#ff1744" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M142 62 Q168 82 180 102" stroke="#ff5252" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M185 15 L195 12 L188 19 Z" fill="#ffcdd2"/>
  </g>

  <!-- Spines -->
  <path d="M88 188 L78 175 L92 178 Z" fill="url(#crimsonHighlight)"/>
  <path d="M96 168 L84 154 L100 158 Z" fill="url(#crimsonHighlight)"/>
  <path d="M106 146 L94 130 L110 137 Z" fill="url(#crimsonHighlight)"/>
  <path d="M118 124 L108 108 L123 117 Z" fill="url(#crimsonHighlight)"/>
  <path d="M132 104 L122 88 L137 98 Z" fill="url(#crimsonHighlight)"/>

  <!-- Head -->
  <path d="M138 85 Q152 65 178 60 Q205 64 218 80 Q215 92 196 95 Q180 98 165 106 Q148 112 138 85 Z" fill="url(#crimsonScaleGrad)"/>
  <path d="M162 70 Q178 64 198 72 L188 80 Q172 75 162 70 Z" fill="url(#crimsonHighlight)"/>

  <!-- Horns -->
  <path d="M146 72 Q125 35 98 18 Q120 38 138 64 Z" fill="url(#crimsonHorn)" stroke="#ff1744" stroke-width="0.8"/>
  <path d="M158 66 Q142 22 112 8 Q138 28 152 58 Z" fill="url(#crimsonHorn)" stroke="#ff5252" stroke-width="0.8"/>

  <!-- Eye -->
  <g filter="url(#crimsonGlow)">
    <polygon points="172,74 184,76 179,83 169,80" fill="#210404"/>
    <ellipse cx="176" cy="78" rx="5" ry="3.5" fill="#ffd600"/>
    <ellipse cx="176" cy="78" rx="2" ry="1.2" fill="#ffffff"/>
    <polygon points="175.5,74.5 177,77.5 175.5,81.5 174.5,77.5" fill="#000"/>
  </g>

  <!-- Maw & Fangs -->
  <path d="M168 106 Q185 105 205 96 L202 108 Q182 118 162 112 Z" fill="url(#crimsonScaleGrad)"/>
  <polygon points="184,88 187,97 189,88" fill="#fff"/>
  <polygon points="192,86 196,99 199,86" fill="#fff"/>
  <polygon points="201,84 204,95 207,84" fill="#fff"/>
  <polygon points="188,104 191,95 193,103" fill="#fff"/>
  <polygon points="198,101 201,92 203,100" fill="#fff"/>

  <!-- Fire Breath -->
  <g filter="url(#crimsonGlow)">
    <path d="M198 92 Q218 90 236 86 Q228 102 204 100 Z" fill="url(#crimsonFire)"/>
    <circle cx="222" cy="86" r="6" fill="#ff1744" opacity="0.7"/>
    <circle cx="232" cy="84" r="7" fill="#ff8a80" opacity="0.6"/>
  </g>
</svg>
