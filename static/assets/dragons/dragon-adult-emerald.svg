<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.35"/>
      <stop offset="65%" stop-color="#004d40" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="emeraldScaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00897b"/>
      <stop offset="35%" stop-color="#004d40"/>
      <stop offset="70%" stop-color="#00251a"/>
      <stop offset="100%" stop-color="#00100b"/>
    </linearGradient>
    <linearGradient id="emeraldHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1de9b6"/>
      <stop offset="45%" stop-color="#00bfa5"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>
    <linearGradient id="emeraldHorn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="50%" stop-color="#271c19"/>
      <stop offset="100%" stop-color="#0a0505"/>
    </linearGradient>
    <radialGradient id="emeraldMembrane" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#004d40"/>
      <stop offset="40%" stop-color="#00251a"/>
      <stop offset="100%" stop-color="#00100b"/>
    </radialGradient>
    <linearGradient id="emeraldFire" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#b9f6ca"/>
      <stop offset="45%" stop-color="#00e676"/>
      <stop offset="75%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#004d40" stop-opacity="0"/>
    </linearGradient>
    <filter id="emeraldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

