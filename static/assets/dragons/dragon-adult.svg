<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">
  <defs>
    <radialGradient id="adultDark" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="35%" stop-color="#212121"/>
      <stop offset="75%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="adultFireWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="40%" stop-color="#b71c1c"/>
      <stop offset="85%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <linearGradient id="fireBreath" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ffff00"/>
      <stop offset="60%" stop-color="#ff3d00"/>
      <stop offset="100%" stop-color="#dd2c00"/>
    </linearGradient>
    <filter id="infernoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#ff3d00" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Huge Distant Wing (Left) -->
  <path d="M48 60 L18 8 L44 14 L75 25 L65 65 Z" fill="#1a1a1a" opacity="0.9"/>
  <!-- Powerful Spiked Tail -->
  <path d="M40 85 Q15 95 6 72 Q0 50 2 35 Q10 40 10 58 Q14 82 45 96 Z" fill="#181818"/>
  <polygon points="2,35 6,24 10,40" fill="#b71c1c"/>
  <polygon points="10,50 16,42 14,58" fill="#b71c1c"/>
  <!-- Heavy Armor Body -->
  <path d="M40 70 Q55 58 78 68 Q95 80 82 105 Q60 110 40 92 Z" fill="url(#adultDark)"/>
  <!-- Dorsal Spines -->
  <polygon points="46,62 50,46 54,64" fill="#b71c1c"/>
  <polygon points="56,64 61,48 65,66" fill="#b71c1c"/>
  <polygon points="67,68 73,52 77,72" fill="#b71c1c"/>
  <polygon points="78,75 84,62 88,80" fill="#b71c1c"/>
  <!-- Talons -->
  <path d="M48 98 L38 122 L46 124 L52 118 L55 102 Z" fill="#101010" stroke="#b71c1c" stroke-width="1"/>
  <path d="M72 102 L70 126 L78 126 L84 120 L80 104 Z" fill="#101010" stroke="#b71c1c" stroke-width="1"/>
  <!-- Massive Wing (Foreground, Majestic Span) -->
  <path d="M52 68 Q80 8 135 6 C115 28 140 45 125 75 C105 68 85 82 65 72 Z" fill="url(#adultFireWing)" stroke="#ff3d00" stroke-width="1.5"/>
  <path d="M52 68 L135 6 M75 35 L125 75 M65 52 L95 72" stroke="#ff8f00" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- Crest and Head -->
  <path d="M74 72 Q90 52 105 44 Q125 36 138 42 Q142 50 132 58 Q115 70 88 84 Z" fill="url(#adultDark)"/>
  <!-- Sweeping Curved Horns -->
  <path d="M110 40 Q130 15 146 10 Q135 25 122 38 Z" fill="#111" stroke="#ff3d00" stroke-width="1"/>
  <path d="M104 44 Q122 22 135 22 Q126 34 116 45 Z" fill="#222"/>
  <!-- Burning Smoldering Eye -->
  <circle cx="124" cy="46" r="4" fill="#ff1744" filter="url(#infernoGlow)"/>
  <ellipse cx="124" cy="46" rx="1.2" ry="3.5" fill="#ffff00"/>
  <!-- Roaring Maw & Massive Fire Breath Stream -->
  <path d="M136 48 L146 54 L134 60 Z" fill="#ff3d00"/>
  <path d="M142 52 Q150 48 160 50 Q152 58 140 56 Z" fill="url(#fireBreath)" filter="url(#infernoGlow)"/>
  <circle cx="156" cy="49" r="3" fill="#fff59d"/>
</svg>