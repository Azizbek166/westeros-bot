<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- Background aura / glow -->
    <radialGradient id="balerionAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff3d00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#b71c1c" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep obsidian dragon scales -->
    <linearGradient id="blackScaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3038"/>
      <stop offset="35%" stop-color="#1a1c22"/>
      <stop offset="70%" stop-color="#0e1013"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>

    <!-- Armor highlight gradient -->
    <linearGradient id="armorHighlight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4a5260"/>
      <stop offset="45%" stop-color="#242831"/>
      <stop offset="100%" stop-color="#0d0e12"/>
    </linearGradient>

    <!-- Horn ivory/obsidian gradient -->
    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4450"/>
      <stop offset="50%" stop-color="#1f232b"/>
      <stop offset="100%" stop-color="#0a0c0e"/>
    </linearGradient>

    <!-- Wing membrane with volcanic veins -->
    <radialGradient id="wingMembrane" cx="60%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#5a1818"/>
      <stop offset="35%" stop-color="#310c0c"/>
      <stop offset="75%" stop-color="#1a0606"/>
      <stop offset="100%" stop-color="#0b0303"/>
    </radialGradient>

    <!-- Fiery dragon breath & lava glow -->
    <linearGradient id="fireBlast" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="15%" stop-color="#fff59d"/>
      <stop offset="35%" stop-color="#ffab00"/>
      <stop offset="65%" stop-color="#ff3d00"/>
      <stop offset="90%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#b71c1c" stop-opacity="0"/>
    </linearGradient>

    <!-- Underbelly fiery glow -->
    <linearGradient id="magmaGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6d00"/>
      <stop offset="50%" stop-color="#dd2c00"/>
      <stop offset="100%" stop-color="#3e0a0a"/>
    </linearGradient>

    <!-- Eye glowing filter -->
    <filter id="infernoEyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Flame trail blur -->
    <filter id="fireBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Infernal Glow Aura -->
  <circle cx="120" cy="120" r="110" fill="url(#balerionAura)"/>

  <!-- Left Distant Wing (Majestic Spacing) -->
  <g opacity="0.85">
    <path d="M72 110 L15 32 Q45 28 85 45 Q115 65 110 95 Z" fill="url(#wingMembrane)"/>
    <path d="M72 110 L15 32 Q28 62 48 95" stroke="#ff3d00" stroke-width="1.2" stroke-opacity="0.4" fill="none"/>
    <path d="M48 95 L15 32 Q55 58 85 45" stroke="#ff6d00" stroke-width="0.8" stroke-opacity="0.3" fill="none"/>
    <!-- Wing bone structure -->
    <path d="M72 110 Q50 65 15 32 Q14 28 18 30 Q58 60 76 106 Z" fill="url(#blackScaleGrad)"/>
    <!-- Wing thumb claw -->
    <path d="M15 32 L11 25 L16 28 Z" fill="#cfd8dc"/>
  </g>

  <!-- Muscular Armored Neck (Rear Base) -->
  <path d="M92 195 Q105 145 125 105 Q145 75 168 68 Q155 120 135 185 Q118 215 92 195 Z" fill="url(#blackScaleGrad)"/>

  <!-- Glowing Magma Veins on Neck Underbelly -->
  <path d="M128 178 Q140 140 155 102 Q158 96 162 104 Q146 142 134 182 Z" fill="url(#magmaGlow)" opacity="0.85"/>
  <path d="M136 160 Q145 130 152 108" stroke="#ffd600" stroke-width="1" stroke-dasharray="3 4" opacity="0.75"/>

  <!-- Right Fore-Wing (Dominant Spanning Blade) -->
  <g>
    <path d="M95 145 Q125 40 185 15 C175 42 192 68 180 102 C162 106 138 128 112 148 Z" fill="url(#wingMembrane)"/>
    <path d="M95 145 Q135 78 185 15" stroke="#ff3d00" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M142 62 Q168 82 180 102" stroke="#ff6d00" stroke-width="1.2" stroke-opacity="0.6"/>
    <path d="M120 95 Q135 115 155 122" stroke="#ff9100" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Foreground Wing Claws -->
    <path d="M185 15 L195 12 L188 19 Z" fill="#eceff1"/>
    <path d="M180 102 L186 106 L178 108 Z" fill="#cfd8dc"/>
  </g>

  <!-- Heavy Spinal Ridge Plates & Barbs -->
  <path d="M88 188 L78 175 L92 178 Z" fill="url(#armorHighlight)"/>
  <path d="M96 168 L84 154 L100 158 Z" fill="url(#armorHighlight)"/>
  <path d="M106 146 L94 130 L110 137 Z" fill="url(#armorHighlight)"/>
  <path d="M118 124 L108 108 L123 117 Z" fill="url(#armorHighlight)"/>
  <path d="M132 104 L122 88 L137 98 Z" fill="url(#armorHighlight)"/>
  <path d="M146 86 L138 72 L151 81 Z" fill="url(#armorHighlight)"/>

  <!-- Armored Dragon Head (Chiseled, Sinister & Ancient) -->
  <!-- Upper Cranium and Snout -->
  <path d="M138 85 Q152 65 178 60 Q205 64 218 80 Q215 92 196 95 Q180 98 165 106 Q148 112 138 85 Z" fill="url(#blackScaleGrad)" stroke="#1a1c22" stroke-width="1"/>
  <!-- Brow Armor Ridge -->
  <path d="M162 70 Q178 64 198 72 L188 80 Q172 75 162 70 Z" fill="url(#armorHighlight)"/>
  <!-- Snout Scales Texture -->
  <path d="M182 72 L194 74 L190 78 L178 76 Z" fill="#121418"/>
  <path d="M192 76 L206 78 L202 83 L188 81 Z" fill="#15171d"/>

  <!-- Massive Curved Royal Horns (Crown of Balerion) -->
  <!-- Primary Top Left Horn -->
  <path d="M146 72 Q125 35 98 18 Q120 38 138 64 Z" fill="url(#hornGrad)" stroke="#ff3d00" stroke-width="0.7"/>
  <path d="M98 18 Q104 15 108 22" stroke="#ff6d00" stroke-width="1.2"/>
  <!-- Primary Top Right Horn (Massive Sweeping Spine) -->
  <path d="M158 66 Q142 22 112 8 Q138 28 152 58 Z" fill="url(#hornGrad)" stroke="#ff9100" stroke-width="0.8"/>
  <path d="M112 8 Q118 6 122 12" stroke="#ffd600" stroke-width="1"/>
  <!-- Secondary Lower Cheek Horns / Spikes -->
  <path d="M152 98 Q135 108 122 115 Q138 104 150 94 Z" fill="url(#hornGrad)"/>
  <path d="M165 105 Q154 122 142 132 Q156 116 163 102 Z" fill="url(#hornGrad)"/>

  <!-- Menacing Piercing Dragon Eye -->
  <g filter="url(#infernoEyeGlow)">
    <polygon points="172,74 184,76 179,83 169,80" fill="#210404"/>
    <ellipse cx="176" cy="78" rx="5" ry="3.5" fill="#ff1744"/>
    <ellipse cx="176" cy="78" rx="3.5" ry="2.2" fill="#ff9100"/>
    <ellipse cx="176" cy="78" rx="2" ry="1.2" fill="#ffff00"/>
    <!-- Cat-like slit pupil -->
    <polygon points="175.5,74.5 177,77.5 175.5,81.5 174.5,77.5" fill="#050000"/>
    <circle cx="174" cy="76" r="0.8" fill="#ffffff"/>
  </g>

  <!-- Nostril with rising smoke -->
  <ellipse cx="208" cy="80" rx="3" ry="1.8" fill="#08080a" stroke="#ff3d00" stroke-width="0.8"/>
  <path d="M210 78 Q216 70 214 62 Q218 65 215 75 Z" fill="#ff5722" opacity="0.6"/>

  <!-- Ferocious Lower Jaw & Razor Fangs -->
  <path d="M168 106 Q185 105 205 96 L202 108 Q182 118 162 112 Z" fill="url(#blackScaleGrad)"/>
  <!-- Upper Razor Fangs (Ivory with blood-fire tint) -->
  <polygon points="184,88 187,97 189,88" fill="#fff9c4"/>
  <polygon points="192,86 196,99 199,86" fill="#ffffff"/>
  <polygon points="201,84 204,95 207,84" fill="#fff9c4"/>
  <polygon points="209,83 212,90 214,83" fill="#ffe082"/>
  <!-- Lower Razor Fangs -->
  <polygon points="188,104 191,95 193,103" fill="#fff9c4"/>
  <polygon points="198,101 201,92 203,100" fill="#ffffff"/>
  <polygon points="205,98 208,91 210,97" fill="#ffe082"/>

  <!-- Roaring Maw Interior (Hellfire Pit) -->
  <path d="M182 89 Q195 95 206 87 Q198 103 182 98 Z" fill="#bf360c"/>
  <ellipse cx="194" cy="94" rx="8" ry="4" fill="#ff3d00" opacity="0.9"/>
  <ellipse cx="196" cy="94" rx="4" ry="2" fill="#ffff00"/>

  <!-- Valyrian Fire Breath Stream (Dracarys!) -->
  <g filter="url(#fireBlur)">
    <!-- Core high-temperature stream -->
    <path d="M198 92 Q218 90 236 86 Q228 102 204 100 Z" fill="url(#fireBlast)"/>
    <path d="M208 90 Q225 82 240 82 Q232 96 214 96 Z" fill="#ff9100" opacity="0.8"/>
    <!-- Outer fiery plumes and billows -->
    <circle cx="218" cy="88" r="7" fill="#ff5722" opacity="0.6"/>
    <circle cx="228" cy="85" r="9" fill="#ffab00" opacity="0.5"/>
    <circle cx="236" cy="82" r="6" fill="#fff59d" opacity="0.7"/>
    <!-- Floating ember sparks -->
    <circle cx="220" cy="74" r="1.5" fill="#ffff00"/>
    <circle cx="232" cy="72" r="1.2" fill="#ff6d00"/>
    <circle cx="226" cy="104" r="1.8" fill="#ff3d00"/>
    <circle cx="238" cy="98" r="1.3" fill="#ffab00"/>
    <circle cx="212" cy="108" r="1" fill="#ffd600"/>
  </g>
</svg>
