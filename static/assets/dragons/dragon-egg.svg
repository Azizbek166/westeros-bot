<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 220" width="180" height="220">
  <defs>
    <!-- Fiery Outer Halo -->
    <radialGradient id="eggAura" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#ff3d00" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#b71c1c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Shell Stone/Obsidian base -->
    <radialGradient id="eggShell" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#4e342e"/>
      <stop offset="35%" stop-color="#2d1c18"/>
      <stop offset="75%" stop-color="#140a08"/>
      <stop offset="100%" stop-color="#050202"/>
    </radialGradient>

    <!-- Scale Shading Gradient -->
    <linearGradient id="scaleDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d4c41"/>
      <stop offset="50%" stop-color="#3e2723"/>
      <stop offset="100%" stop-color="#1b0000"/>
    </linearGradient>

    <!-- Scale Highlight -->
    <linearGradient id="scaleHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8a65"/>
      <stop offset="40%" stop-color="#d84315"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>

    <!-- Magma Crack Glow -->
    <linearGradient id="magmaCrack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffff00"/>
      <stop offset="70%" stop-color="#ff3d00"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>

    <filter id="eggGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Aura -->
  <circle cx="90" cy="115" r="85" fill="url(#eggAura)"/>

  <!-- Base Egg Form -->
  <path d="M90 22 C142 22 165 85 165 135 C165 185 132 208 90 208 C48 208 15 185 15 135 C15 85 38 22 90 22 Z" fill="url(#eggShell)" stroke="#ff5722" stroke-width="1"/>

  <!-- Overlapping Diamond Reptilian Scales Texture -->
  <!-- Row 1 (Top) -->
  <path d="M90 26 L98 40 L90 54 L82 40 Z" fill="url(#scaleHighlight)"/>
  <path d="M76 44 L84 58 L76 72 L68 58 Z" fill="url(#scaleDark)"/>
  <path d="M104 44 L112 58 L104 72 L96 58 Z" fill="url(#scaleHighlight)"/>

  <!-- Row 2 -->
  <path d="M62 62 L70 76 L62 90 L54 76 Z" fill="url(#scaleDark)"/>
  <path d="M90 60 L100 75 L90 92 L80 75 Z" fill="url(#scaleHighlight)"/>
  <path d="M118 62 L126 76 L118 90 L110 76 Z" fill="url(#scaleDark)"/>

  <!-- Row 3 -->
  <path d="M48 82 L58 98 L48 114 L38 98 Z" fill="url(#scaleDark)"/>
  <path d="M76 80 L88 98 L76 116 L64 98 Z" fill="url(#scaleHighlight)"/>
  <path d="M104 80 L116 98 L104 116 L92 98 Z" fill="url(#scaleHighlight)"/>
  <path d="M132 82 L142 98 L132 114 L122 98 Z" fill="url(#scaleDark)"/>

  <!-- Row 4 (Center - Majestic Scales) -->
  <path d="M35 106 L46 124 L35 142 L24 124 Z" fill="url(#scaleDark)"/>
  <path d="M64 104 L78 124 L64 144 L50 124 Z" fill="url(#scaleHighlight)"/>
  <path d="M92 102 L106 122 L92 144 L78 122 Z" fill="url(#scaleHighlight)"/>
  <path d="M120 104 L134 124 L120 144 L106 124 Z" fill="url(#scaleHighlight)"/>
  <path d="M145 106 L156 124 L145 142 L134 124 Z" fill="url(#scaleDark)"/>

  <!-- Row 5 -->
  <path d="M50 134 L62 152 L50 170 L38 152 Z" fill="url(#scaleDark)"/>
  <path d="M78 132 L92 152 L78 172 L64 152 Z" fill="url(#scaleHighlight)"/>
  <path d="M106 132 L120 152 L106 172 L92 152 Z" fill="url(#scaleHighlight)"/>
  <path d="M134 134 L146 152 L134 170 L122 152 Z" fill="url(#scaleDark)"/>

  <!-- Row 6 (Base) -->
  <path d="M64 162 L76 178 L64 194 L52 178 Z" fill="url(#scaleDark)"/>
  <path d="M92 160 L104 178 L92 196 L80 178 Z" fill="url(#scaleHighlight)"/>
  <path d="M120 162 L132 178 L120 194 L108 178 Z" fill="url(#scaleDark)"/>

  <!-- Runic Valyrian Magma Fissures Glowing Across Shell -->
  <g filter="url(#eggGlow)">
    <path d="M90 35 Q96 65 88 95 Q82 120 95 150 Q105 175 92 200" stroke="url(#magmaCrack)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M88 95 Q115 110 128 130 Q138 145 130 170" stroke="url(#magmaCrack)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <path d="M82 120 Q60 135 48 155" stroke="url(#magmaCrack)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <circle cx="95" cy="150" r="3" fill="#ffffff"/>
    <circle cx="88" cy="95" r="2.5" fill="#ffff00"/>
    <circle cx="128" cy="130" r="2" fill="#ff9100"/>
  </g>
</svg>
