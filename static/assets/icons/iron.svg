      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="35%" stop-color="#546e7a"/>
      <stop offset="70%" stop-color="#263238"/>
      <stop offset="100%" stop-color="#10171a"/>
    </linearGradient>
    <linearGradient id="ironTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfd8dc"/>
