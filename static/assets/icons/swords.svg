<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bladeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#cfd8dc"/>
      <stop offset="80%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
    <linearGradient id="hiltGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
  </defs>
  <!-- Sword 1 (top-left to bottom-right) -->
  <g transform="rotate(45 32 32)">
    <path d="M30 4 L34 4 L33 46 L31 46 Z" fill="url(#bladeGrad)"/>
    <path d="M32 4 L32 46" stroke="#455a64" stroke-width="0.8"/>
    <!-- Crossguard -->
    <rect x="23" y="46" width="18" height="3" rx="1" fill="url(#hiltGold)" stroke="#6d4c41" stroke-width="0.8"/>
    <!-- Grip -->
    <rect x="30" y="49" width="4" height="9" fill="#5d4037"/>
    <!-- Pommel -->
    <circle cx="32" cy="60" r="3" fill="url(#hiltGold)" stroke="#6d4c41" stroke-width="0.8"/>
  </g>
  <!-- Sword 2 (top-right to bottom-left) -->
  <g transform="rotate(-45 32 32)">
    <path d="M30 4 L34 4 L33 46 L31 46 Z" fill="url(#bladeGrad)"/>
    <path d="M32 4 L32 46" stroke="#455a64" stroke-width="0.8"/>
    <!-- Crossguard -->
    <rect x="23" y="46" width="18" height="3" rx="1" fill="url(#hiltGold)" stroke="#6d4c41" stroke-width="0.8"/>
    <!-- Grip -->
    <rect x="30" y="49" width="4" height="9" fill="#5d4037"/>
    <!-- Pommel -->
    <circle cx="32" cy="60" r="3" fill="url(#hiltGold)" stroke="#6d4c41" stroke-width="0.8"/>
  </g>
  <!-- Center Clash Spark -->
  <circle cx="32" cy="32" r="3" fill="#fff9c4"/>
  <polygon points="32,24 34,31 41,32 34,33 32,40 30,33 23,32 30,31" fill="#fff59d"/>
</svg>