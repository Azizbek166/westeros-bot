<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120">
  <defs>
    <linearGradient id="goldPalace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="35%" stop-color="#ffd54f"/>
      <stop offset="70%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#8d6e63"/>
    </linearGradient>
    <linearGradient id="goldenDome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffe082"/>
      <stop offset="80%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#7e3ff2"/>
    </linearGradient>
    <filter id="royalShine" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffd700" flood-opacity="0.8"/>
    </filter>
  </defs>
  <polygon points="15,108 125,108 120,68 20,68" fill="url(#goldPalace)" stroke="#b26a00" stroke-width="1.5"/>
  <polygon points="32,68 108,68 104,38 36,38" fill="url(#goldPalace)" stroke="#b26a00" stroke-width="1.5"/>
  <!-- Gilded Domes -->
  <path d="M55 38 Q70 8 85 38 Z" fill="url(#goldenDome)" filter="url(#royalShine)"/>
  <line x1="70" y1="8" x2="70" y2="0" stroke="#ffd700" stroke-width="2"/>
  <circle cx="70" cy="0" r="2.5" fill="#fff"/>
  <path d="M15 68 Q25 40 35 68 Z" fill="url(#goldenDome)"/>
  <path d="M105 68 Q115 40 125 68 Z" fill="url(#goldenDome)"/>
  <!-- Grand Gate -->
  <path d="M58 108 L58 84 C58 74 82 74 82 84 L82 108 Z" fill="#2d1700" stroke="#ffd700" stroke-width="2"/>
  <circle cx="70" cy="52" r="5" fill="#ffd700" filter="url(#royalShine)"/>
</svg>