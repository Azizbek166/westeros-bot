<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120">
  <defs>
    <linearGradient id="citadelStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="35%" stop-color="#90a4ae"/>
      <stop offset="70%" stop-color="#455a64"/>
      <stop offset="100%" stop-color="#1c2529"/>
    </linearGradient>
    <linearGradient id="royalGoldTrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8c2c"/>
    </linearGradient>
  </defs>
  <!-- Grand Base Bastion -->
  <polygon points="15,108 125,108 120,70 20,70" fill="url(#citadelStone)" stroke="#263238" stroke-width="1.5"/>
  <!-- Middle Tier Keep -->
  <polygon points="30,70 110,70 105,40 35,40" fill="url(#citadelStone)" stroke="#263238" stroke-width="1.5"/>
  <!-- Highest Central Imperial Spires -->
  <polygon points="55,40 85,40 82,18 58,18" fill="url(#citadelStone)" stroke="#263238" stroke-width="1.5"/>
  <polygon points="54,18 70,2 86,18" fill="url(#royalGoldTrim)"/>
  <!-- Imperial Banner atop highest spire -->
  <line x1="70" y1="2" x2="70" y2="-4" stroke="#d4af37" stroke-width="1.5"/>
  <path d="M70 -4 L82 -1 L70 2 Z" fill="#b71c1c"/>
  
  <!-- Left Grand Flanking Tower -->
  <polygon points="10,108 30,108 28,32 14,32" fill="url(#citadelStone)" stroke="#263238" stroke-width="1.5"/>
  <polygon points="12,32 21,12 30,32" fill="url(#royalGoldTrim)"/>
  <!-- Right Grand Flanking Tower -->
  <polygon points="110,108 130,108 126,32 112,32" fill="url(#citadelStone)" stroke="#263238" stroke-width="1.5"/>
  <polygon points="110,32 119,12 128,32" fill="url(#royalGoldTrim)"/>

  <!-- Battlements with Gold Trim -->
  <rect x="20" y="66" width="100" height="4" fill="url(#royalGoldTrim)"/>
  <rect x="35" y="38" width="70" height="3" fill="url(#royalGoldTrim)"/>

  <!-- Grand Entrance Portal -->
  <path d="M58 108 L58 84 C58 74 82 74 82 84 L82 108 Z" fill="#0d1316" stroke="url(#royalGoldTrim)" stroke-width="2"/>
  <!-- Golden Portcullis Grate -->
  <line x1="64" y1="80" x2="64" y2="108" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="70" y1="76" x2="70" y2="108" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="76" y1="80" x2="76" y2="108" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="58" y1="88" x2="82" y2="88" stroke="#d4af37" stroke-width="1.5"/>
  <line x1="58" y1="98" x2="82" y2="98" stroke="#d4af37" stroke-width="1.5"/>

  <!-- High Rose Window / Stained Glass -->
  <circle cx="70" cy="54" r="6" fill="#1565c0" stroke="url(#royalGoldTrim)" stroke-width="1.5"/>
  <circle cx="70" cy="54" r="2.5" fill="#ffd700"/>
  <!-- Flanking Wall Torches -->
  <circle cx="50" cy="86" r="3" fill="#ff9100"/>
  <circle cx="90" cy="86" r="3" fill="#ff9100"/>
</svg>