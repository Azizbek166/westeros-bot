  <rect x="37" y="38" width="8" height="7" fill="url(#stoneWall2)"/>
  <rect x="51" y="38" width="8" height="7" fill="url(#stoneWall2)"/>
  <rect x="65" y="38" width="8" height="7" fill="url(#stoneWall2)"/>
  <rect x="79" y="38" width="6" height="7" fill="url(#stoneWall2)"/>
