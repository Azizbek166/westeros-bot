  <path d="M48 95 L48 72 C48 62 72 62 72 72 L72 95 Z" fill="#151b1e" stroke="#455a64" stroke-width="1.5"/>
  <!-- Portcullis Iron Grate -->
  <line x1="53" y1="68" x2="53" y2="95" stroke="#78909c" stroke-width="1.5"/>
  <line x1="60" y1="65" x2="60" y2="95" stroke="#78909c" stroke-width="1.5"/>
  <line x1="67" y1="68" x2="67" y2="95" stroke="#78909c" stroke-width="1.5"/>
  <line x1="48" y1="74" x2="72" y2="74" stroke="#78909c" stroke-width="1.5"/>
  <line x1="48" y1="84" x2="72" y2="84" stroke="#78909c" stroke-width="1.5"/>
