  <polygon points="18,95 38,95 36,25 20,25" fill="url(#stoneWall2)" stroke="#263238" stroke-width="1.5"/>
  <rect x="18" y="22" width="20" height="4" fill="#37474f"/>
  <polygon points="16,22 28,6 40,22" fill="url(#roofSlate)"/>
