  <circle cx="60" cy="52" r="5" fill="#d4af37"/>
  <circle cx="60" cy="52" r="3" fill="#b71c1c"/>
  <!-- Torches flanking gate -->
  <circle cx="43" cy="74" r="2.5" fill="#ff9100"/>
  <circle cx="77" cy="74" r="2.5" fill="#ff9100"/>
