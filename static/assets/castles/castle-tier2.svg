<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 110" width="120" height="110">
  <defs>
    <linearGradient id="stoneWall2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="40%" stop-color="#78909c"/>
      <stop offset="85%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#1c2529"/>
    </linearGradient>
    <linearGradient id="roofSlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#455a64"/>
