<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="stoneWall1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#90a4ae"/>
      <stop offset="50%" stop-color="#607d8b"/>
      <stop offset="100%" stop-color="#37474f"/>
    </linearGradient>
    <linearGradient id="woodBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d6e63"/>
      <stop offset="100%" stop-color="#4e342e"/>
    </linearGradient>
  </defs>
  <!-- Hill base -->
  <path d="M10 90 Q50 78 90 90 L90 95 L10 95 Z" fill="#2e382e"/>
  <!-- Main Watchtower Body -->
  <polygon points="34,85 66,85 62,35 38,35" fill="url(#stoneWall1)" stroke="#263238" stroke-width="1.5"/>
  <!-- Wooden balcony / hoarding -->
  <rect x="32" y="30" width="36" height="8" rx="1" fill="url(#woodBeam)" stroke="#271b17" stroke-width="1"/>
  <!-- Upper battlements -->
  <polygon points="34,30 66,30 64,18 36,18" fill="url(#stoneWall1)"/>
  <!-- Merlons (Crenels) -->
  <rect x="34" y="14" width="6" height="6" fill="url(#stoneWall1)"/>
  <rect x="47" y="14" width="6" height="6" fill="url(#stoneWall1)"/>
  <rect x="60" y="14" width="6" height="6" fill="url(#stoneWall1)"/>
  <!-- Wooden roof peak -->
  <polygon points="32,18 50,4 68,18" fill="url(#woodBeam)"/>
  <!-- Outpost Flag -->
  <path d="M50 4 L50 0 M50 0 L58 3 L50 6" stroke="#b71c1c" stroke-width="1.5" fill="#b71c1c"/>
  <!-- Narrow Arrow Slit & Wooden Door -->
  <rect x="48" y="24" width="4" height="6" rx="1" fill="#1a2327"/>
  <rect x="47" y="44" width="6" height="12" rx="1" fill="#1a2327"/>
  <!-- Heavy Oak Door -->
  <path d="M44 85 L44 70 C44 65 56 65 56 70 L56 85 Z" fill="url(#woodBeam)" stroke="#1e130f" stroke-width="1"/>
  <!-- Wall Bricks Texture -->
  <line x1="40" y1="50" x2="60" y2="50" stroke="#37474f" stroke-width="0.8"/>
  <line x1="39" y1="62" x2="61" y2="62" stroke="#37474f" stroke-width="0.8"/>
  <!-- Torch on side -->
  <circle cx="68" cy="48" r="2.5" fill="#ff9100"/>
  <circle cx="68" cy="48" r="1.5" fill="#ffeb3b"/>
</svg>