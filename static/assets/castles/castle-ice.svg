<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" width="140" height="120">
  <defs>
    <linearGradient id="iceStone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f7fa"/>
      <stop offset="35%" stop-color="#80deea"/>
      <stop offset="70%" stop-color="#00838f"/>
      <stop offset="100%" stop-color="#00363a"/>
    </linearGradient>
    <linearGradient id="frostSpire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#b2ebf2"/>
      <stop offset="100%" stop-color="#00acc1"/>
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#4dd0e1" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Snow and Ice Base -->
  <path d="M10 110 Q70 102 130 110 L135 116 L5 116 Z" fill="#e0f7fa"/>
  <!-- Base Ice Citadel -->
  <polygon points="20,108 120,108 116,68 24,68" fill="url(#iceStone)" stroke="#004d40" stroke-width="1.5"/>
  <!-- Middle Tier -->
  <polygon points="35,68 105,68 100,38 40,38" fill="url(#iceStone)" stroke="#004d40" stroke-width="1.5"/>
  <!-- Crystal Spires -->
  <polygon points="58,38 70,6 82,38" fill="url(#frostSpire)" filter="url(#iceGlow)"/>
  <polygon points="16,68 24,20 34,68" fill="url(#frostSpire)" filter="url(#iceGlow)"/>
  <polygon points="106,68 116,20 124,68" fill="url(#frostSpire)" filter="url(#iceGlow)"/>
  <!-- Ice Portal -->
  <path d="M58 108 L58 84 C58 74 82 74 82 84 L82 108 Z" fill="#00252b" stroke="#80deea" stroke-width="2"/>
  <circle cx="70" cy="52" r="5" fill="#e0f7fa" filter="url(#iceGlow)"/>
  <!-- Ice Shimmer Stars -->
  <circle cx="70" cy="6" r="2.5" fill="#ffffff"/>
</svg>